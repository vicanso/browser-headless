[package]
name = "browser-headless"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["query"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "time", "macros", "signal", "sync"] }
num_cpus = "1.17.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
chromiumoxide = { version = "0.9.1", default-features = false }
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
htmd = "0.5.4"
url = "2.5.8"
uuid = { version = "1.23.1", features = ["v4"] }
