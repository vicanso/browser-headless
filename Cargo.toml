[package]
name = "browser-headless"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["query"] }
# Response compression for the large HTML/markdown/JSON payloads /summary
# returns — negotiated via Accept-Encoding, so plain clients are unaffected.
tower-http = { version = "0.7.0", features = ["compression-gzip", "compression-br", "compression-zstd"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "macros", "signal", "sync", "io-util"] }
num_cpus = "1.17.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
chromiumoxide = { version = "0.9.1", default-features = false }
futures = "0.3.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
htmd = "0.5.4"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }
subtle = "2.6"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
redis = { version = "1.4.1", features = ["tokio-comp", "streams", "tokio-rustls-comp", "cluster-async"] }
# redis's `tokio-rustls-comp` pulls rustls 0.23 but selects no crypto provider,
# so we enable + install `ring` ourselves (see main.rs). `ring` avoids the
# cmake/C build deps that `aws-lc-rs` needs.
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[dev-dependencies]
# Used by tests/e2e_chrome.rs (ignored by default; CI smoke job enables it).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1.0.151"
tower = { version = "0.5", features = ["util"] }
